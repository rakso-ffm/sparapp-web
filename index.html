<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F7A55">
<meta name="description" content="Kleines Taschengeld-Sparkonto für Kinder – läuft offline im Browser.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sparkonto">
<title>Sparkonto</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Nunito+Sans:wght@400;600;700;800&display=swap">
<style>
  :root {
    --bg:#F2F7F2; --surface:#FFFFFF; --surface-2:#E9F1E8; --border:rgba(23,40,29,0.10);
    --text:#17281D; --muted:#5E7267;
    --accent:#1F7A55; --accent-strong:#166245; --accent-soft:#DFF0E5;
    --gold:#C9962E; --gold-soft:#FBF1DC;
    --danger:#BC5334; --danger-soft:#FAEAE1;
    --shadow: 0 1px 2px rgba(23,40,29,0.06), 0 10px 24px rgba(23,40,29,0.08);
    --radius: 18px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#0E1712; --surface:#16211B; --surface-2:#1C2A22; --border:rgba(230,240,232,0.12);
      --text:#E7F2EA; --muted:#8FA598;
      --accent:#4FBF8B; --accent-strong:#6ED4A4; --accent-soft:#1B3226;
      --gold:#E3B65C; --gold-soft:#2C2314;
      --danger:#E2896A; --danger-soft:#33201A;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 10px 24px rgba(0,0,0,0.35);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg:#0E1712; --surface:#16211B; --surface-2:#1C2A22; --border:rgba(230,240,232,0.12);
    --text:#E7F2EA; --muted:#8FA598;
    --accent:#4FBF8B; --accent-strong:#6ED4A4; --accent-soft:#1B3226;
    --gold:#E3B65C; --gold-soft:#2C2314;
    --danger:#E2896A; --danger-soft:#33201A;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 10px 24px rgba(0,0,0,0.35);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: "Nunito Sans", system-ui, sans-serif; }
  h1,h2,h3 { font-family: "Baloo 2", "Nunito Sans", system-ui, sans-serif; margin: 0; text-wrap: balance; }
  button, input, select { font-family: inherit; color: inherit; }
  button { cursor: pointer; }

  .app { max-width: 520px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }

  .topbar {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
    background: var(--bg); padding: 18px 20px 10px;
    display: flex; align-items: center; gap: 10px;
  }
  .topbar .mark { color: var(--accent); flex-shrink: 0; }
  .topbar h1 { font-size: 20px; font-weight: 700; color: var(--text); }

  main { flex: 1; padding: 4px 20px 24px; }
  main.with-tabbar { padding-bottom: 100px; }

  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 20px;
  }
  .stack { display: flex; flex-direction: column; gap: 14px; }
  .muted { color: var(--muted); }
  .field-label { font-size: 12px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }

  input[type="number"], input[type="date"], input[type="text"], select {
    width: 100%; min-height: 48px; padding: 10px 14px; border-radius: 12px;
    border: 1.5px solid var(--border); background: var(--surface-2); color: var(--text);
    font-size: 16px; font-weight: 600;
  }
  input[type="number"]:focus, input[type="date"]:focus, input[type="text"]:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

  .btn {
    min-height: 48px; border-radius: 12px; border: none; padding: 0 18px;
    font-size: 15px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:disabled { opacity: .45; }
  .btn-ghost { background: var(--surface-2); color: var(--text); }
  .btn-danger { background: var(--danger-soft); color: var(--danger); }
  .btn-danger-solid { background: var(--danger); color: #fff; }
  .btn-block { width: 100%; }

  /* --- Onboarding --- */
  #onboarding-view .hero { text-align: center; padding: 22px 6px 8px; }
  #onboarding-view .hero .mark { color: var(--accent); }
  #onboarding-view .hero h2 { font-size: 24px; margin-top: 10px; }
  #onboarding-view .hero p { margin-top: 6px; }

  /* --- Balance view --- */
  .balance-hero { text-align: center; padding: 40px 12px 28px; }
  .balance-label { font-size: 13px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .balance-amount { font-family: "Baloo 2", sans-serif; font-weight: 700; font-size: clamp(44px, 14vw, 68px); line-height: 1.05; margin-top: 10px; font-variant-numeric: tabular-nums; }
  .balance-since { margin-top: 8px; font-size: 14px; }
  .rule-pill {
    display: inline-flex; align-items: center; gap: 6px; margin-top: 18px; padding: 8px 16px;
    background: var(--accent-soft); color: var(--accent-strong); border-radius: 999px; font-weight: 700; font-size: 13.5px;
  }
  .next-booking { margin-top: 14px; font-size: 13.5px; color: var(--muted); }

  /* --- Add view --- */
  .direction-row { display: flex; gap: 10px; }
  .direction-btn {
    flex: 1; min-height: 52px; border-radius: 14px; border: 1.5px solid var(--border);
    background: var(--surface-2); font-weight: 800; font-size: 15px; color: var(--muted);
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .direction-btn.active.deposit { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-strong); }
  .direction-btn.active.withdraw { background: var(--danger-soft); border-color: var(--danger); color: var(--danger); }
  .amount-input-wrap { text-align: center; }
  #add-amount-input {
    text-align: center; font-family: "Baloo 2", sans-serif; font-size: 40px; font-weight: 700;
    min-height: 72px; border-radius: 16px;
  }
  .tx-row.tappable { width: 100%; text-align: left; font: inherit; color: inherit; cursor: pointer; }
  .tx-row.tappable:active { transform: scale(.99); }
  .tx-chevron { color: var(--muted); font-size: 20px; line-height: 1; margin-left: 2px; }
  .sheet-backdrop {
    position: fixed; inset: 0; z-index: 50; background: rgba(10,20,14,.45);
    display: flex; align-items: flex-end; justify-content: center;
  }
  .sheet-backdrop[hidden] { display: none; }
  .sheet {
    width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto; background: var(--bg);
    border-radius: 22px 22px 0 0; padding: 18px 20px calc(20px + env(safe-area-inset-bottom));
    box-shadow: 0 -10px 30px rgba(0,0,0,.2);
  }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .sheet-title { font-family: "Baloo 2", sans-serif; font-size: 20px; font-weight: 700; }
  .sheet-close { background: var(--surface-2); border: none; border-radius: 999px; width: 36px; height: 36px; font-size: 18px; color: var(--muted); }
  .sheet-note { font-size: 13.5px; line-height: 1.45; }
  .currency-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .currency-chips button {
    border: 1.5px solid var(--border); background: var(--surface); border-radius: 999px; padding: 6px 12px;
    min-height: 36px; font-size: 15px; font-weight: 700; color: var(--text); font-family: inherit;
  }
  .note-center .currency-chips { justify-content: center; }
  .date-hint { font-size: 13px; font-weight: 700; margin-top: 6px; min-height: 18px; }
  .toast { text-align: center; font-size: 13.5px; font-weight: 700; color: var(--accent); min-height: 18px; }

  /* --- History view --- */
  .chart-card { padding: 18px 16px 16px; }
  .chart-empty { text-align: center; padding: 24px 8px; font-size: 14px; }
  .chart-title { font-family: "Baloo 2", sans-serif; font-size: 20px; font-weight: 700; line-height: 1.2; }
  .chart-summary { display: flex; gap: 10px; margin-top: 12px; }
  .sum-chip { flex: 1; border-radius: 14px; padding: 10px 12px; }
  .sum-chip .sum-label { font-size: 12px; font-weight: 700; }
  .sum-chip .sum-value { font-family: "Baloo 2", sans-serif; font-size: 22px; font-weight: 700; line-height: 1.15; font-variant-numeric: tabular-nums; }
  .sum-chip.saved { background: var(--accent-soft); color: var(--accent-strong); }
  .sum-chip.interest { background: var(--gold-soft); color: var(--gold); }
  .bars-scroll { overflow-x: auto; margin: 16px -4px 0; padding: 0 4px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .bars-scroll::-webkit-scrollbar { display: none; }
  .bars { display: flex; align-items: flex-end; gap: 8px; height: 190px; min-width: 100%; padding-top: 26px; }
  .bar {
    flex: 1 0 34px; max-width: 64px; height: 100%; display: flex; flex-direction: column; align-items: stretch;
    justify-content: flex-end; background: none; border: none; padding: 0; position: relative; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .bar-stack {
    display: flex; flex-direction: column; justify-content: flex-end; border-radius: 10px 10px 4px 4px; overflow: hidden;
    height: var(--h); transition: height .6s cubic-bezier(.2,.8,.2,1), opacity .2s, transform .2s;
    opacity: .55; transform-origin: bottom;
  }
  .bars.grow .bar-stack { height: 0; }
  .bar.selected .bar-stack { opacity: 1; transform: scaleX(1.08); }
  .bar:active .bar-stack { transform: scaleX(.94); }
  .seg-saved { background: var(--accent); flex: 1 1 auto; min-height: 0; }
  .seg-interest { background: var(--gold); flex: 0 0 auto; border-bottom: 2px solid var(--surface); }
  .bar-value {
    position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(var(--h) + 4px);
    font-size: 12px; font-weight: 800; white-space: nowrap; color: var(--text); opacity: 0; transition: opacity .2s, bottom .6s;
  }
  .bars.grow .bar-value { bottom: 4px; }
  .bar.selected .bar-value { opacity: 1; }
  .bar-labels { display: flex; gap: 8px; min-width: 100%; margin-top: 6px; }
  .bar-labels span { flex: 1 0 34px; max-width: 64px; text-align: center; font-size: 11px; font-weight: 700; color: var(--muted); }
  .bar-labels span.selected { color: var(--text); }
  .forecast-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
  .forecast-label { font-size: 13px; font-weight: 800; color: var(--muted); }
  .segmented { display: inline-flex; background: var(--surface-2); border-radius: 999px; padding: 3px; gap: 2px; }
  .segmented button {
    border: none; background: none; border-radius: 999px; padding: 7px 11px; min-height: 34px;
    font-size: 13px; font-weight: 800; color: var(--muted); font-family: inherit;
  }
  .segmented button.active { background: var(--surface); color: var(--accent-strong); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .bar.forecast .seg-saved { background: repeating-linear-gradient(135deg, var(--accent) 0 5px, var(--accent-soft) 5px 9px); }
  .bar.forecast .seg-interest { background: repeating-linear-gradient(135deg, var(--gold) 0 5px, var(--gold-soft) 5px 9px); }
  .bar-labels span.forecast { font-weight: 600; }
  .today-divider { flex: 0 0 0; align-self: stretch; border-left: 2px dashed var(--border); margin: 0 -1px; }
  .legend i.striped { background: repeating-linear-gradient(135deg, var(--accent) 0 3px, var(--accent-soft) 3px 5px); }
  .legend { display: flex; gap: 16px; justify-content: center; margin-top: 12px; font-size: 12.5px; font-weight: 700; color: var(--muted); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  .week-info { margin-top: 14px; background: var(--surface-2); border-radius: 14px; padding: 14px; }
  .week-info-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .week-info-title { font-weight: 800; font-size: 14px; }
  .week-info-balance { font-family: "Baloo 2", sans-serif; font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .week-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .week-chip { border-radius: 999px; padding: 4px 10px; font-size: 13px; font-weight: 800; }
  .week-chip.base { background: var(--accent-soft); color: var(--accent-strong); }
  .week-chip.interest { background: var(--gold-soft); color: var(--gold); }
  .week-chip.neg { background: var(--danger-soft); color: var(--danger); }
  .week-msg { margin-top: 8px; font-size: 13.5px; color: var(--muted); }
  .week-nav { display: flex; gap: 8px; margin-top: 12px; }
  .week-nav .btn { flex: 1; min-height: 40px; font-size: 14px; background: var(--surface); border: 1px solid var(--border); }
  .week-nav .btn:disabled { opacity: .4; }
  @media (prefers-reduced-motion: reduce) { .bar-stack, .bar-value { transition: none; } }
  .tx-list { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
  .tx-row {
    display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 12px 14px;
  }
  .tx-icon {
    width: 38px; height: 38px; border-radius: 10px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .tx-icon.pos { background: var(--accent-soft); color: var(--accent-strong); }
  .tx-icon.neg { background: var(--danger-soft); color: var(--danger); }
  .tx-icon.gold { background: var(--gold-soft); color: var(--gold); }
  .tx-body { flex: 1; min-width: 0; }
  .tx-type { font-weight: 700; font-size: 14.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tx-date { font-size: 12.5px; color: var(--muted); margin-top: 1px; }
  .tx-amount { font-weight: 800; font-variant-numeric: tabular-nums; font-size: 15px; white-space: nowrap; }
  .tx-amount.pos { color: var(--accent-strong); }
  .tx-amount.neg { color: var(--danger); }

  /* --- PIN pad --- */
  .pin-title { text-align: center; font-size: 17px; font-weight: 700; margin-bottom: 4px; }
  .pin-sub { text-align: center; font-size: 13.5px; margin-bottom: 18px; }
  .pin-dots { display: flex; justify-content: center; gap: 14px; margin-bottom: 8px; }
  .pin-dot { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--muted); }
  .pin-dot.filled { background: var(--accent); border-color: var(--accent); }
  .pin-error { text-align: center; color: var(--danger); font-size: 13px; font-weight: 700; min-height: 18px; margin-bottom: 6px; }
  .pin-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; max-width: 280px; margin: 10px auto 0; }
  .pin-key {
    min-height: 60px; border-radius: 16px; border: 1px solid var(--border); background: var(--surface-2);
    font-size: 22px; font-weight: 700; color: var(--text);
  }
  .pin-key.empty { visibility: hidden; }

  /* --- Settings --- */
  .settings-section-title { font-size: 15px; font-weight: 800; margin-top: 4px; }
  .danger-box { border: 1.5px solid var(--danger); border-radius: 14px; padding: 16px; background: var(--danger-soft); }
  .confirm-row { display: flex; gap: 10px; margin-top: 12px; }
  .confirm-row .btn { flex: 1; }
  .mode-help { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; font-size: 13.5px; line-height: 1.45; }
  .mode-help p { margin: 0; }
  .mode-help p + p { margin-top: 6px; }
  .footnote { font-size: 12px; color: var(--muted); text-align: center; margin-top: 4px; }

  /* --- Tab bar --- */
  .tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    background: var(--surface); border-top: 1px solid var(--border);
    padding: 8px 10px calc(8px + env(safe-area-inset-bottom, 0px));
    display: flex; justify-content: center;
  }
  .tabbar-inner { display: flex; gap: 4px; max-width: 520px; width: 100%; }
  .tab {
    flex: 1; background: none; border: none; display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding: 6px 4px; border-radius: 12px; color: var(--muted); font-size: 11px; font-weight: 700;
  }
  .tab.active { color: var(--accent); }
  .tab svg { width: 22px; height: 22px; }

  [hidden] { display: none !important; }
</style>
</head>
<body>

<div class="app">

  <section id="onboarding-view" class="stack" hidden>
    <div class="hero">
      <svg class="mark" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 12l2 2 4-4"/></svg>
      <h2>Willkommen bei deinem Sparkonto</h2>
      <p class="muted">Lass uns kurz einrichten, wie dein Guthaben wächst.</p>
    </div>
    <div class="card stack">
      <div>
        <div class="field-label">Startguthaben</div>
        <input type="number" id="ob-balance" min="0" step="1" value="12">
      </div>
      <div>
        <div class="field-label">Startdatum</div>
        <input type="date" id="ob-date">
      </div>
      <div>
        <div class="field-label">Wöchentlicher Betrag (Credits)</div>
        <input type="number" id="ob-weekly" min="0" step="1" value="1">
      </div>
      <div>
        <div class="field-label">Zins-Modus</div>
        <select id="ob-mode">
          <option value="fixed">Nur Fixbetrag</option>
          <option value="percentage">Nur Prozent</option>
          <option value="combined" selected>Fixbetrag + Prozent</option>
        </select>
      </div>
      <div id="ob-percent-group">
        <div class="field-label">Zins % / Monat</div>
        <input type="number" id="ob-percent" min="0" step="0.5" value="5">
        <div class="date-hint muted">Zinsen gibt es immer am 1. des Monats.</div>
      </div>
      <button class="btn btn-primary btn-block" data-action="onboarding-submit">Los geht's</button>
      <p class="footnote">Alle Daten bleiben nur auf diesem Tablet gespeichert. · Version <span class="app-version"></span></p>
    </div>
  </section>

  <div id="app-main" hidden>
    <header class="topbar">
      <svg class="mark" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 12l2 2 4-4"/></svg>
      <h1 id="pageTitle">Kontostand</h1>
    </header>

    <main class="with-tabbar">
      <section id="balance-view"></section>
      <section id="add-view" class="stack" hidden></section>
      <section id="history-view" hidden></section>
      <section id="settings-view" hidden></section>
    </main>
  </div>

  <div class="sheet-backdrop" id="sheet-backdrop" data-action="sheet-backdrop" hidden>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
  </div>

  <nav class="tabbar" id="tabbar" hidden>
    <div class="tabbar-inner">
      <button class="tab" data-action="switch-tab" data-tab="balance">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 12l2 2 4-4"/></svg>
        Kontostand
      </button>
      <button class="tab" data-action="switch-tab" data-tab="add">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
        Buchen
      </button>
      <button class="tab" data-action="switch-tab" data-tab="history">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 8v4l3 2"/></svg>
        Verlauf
      </button>
      <button class="tab" data-action="switch-tab" data-tab="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="9" width="16" height="11" rx="2"/><path d="M8 9V7a4 4 0 0 1 8 0v2"/></svg>
        Eltern
      </button>
    </div>
  </nav>
</div>

<script>
(function () {
  "use strict";

  var STORAGE_KEY = "sparapp_tablet_v1";
  var APP_VERSION = "10";
  var TITLES = { balance: "Kontostand", add: "Buchen", history: "Verlauf", settings: "Eltern-Zugang" };
  var TYPE_LABEL = {
    initial: "Startguthaben",
    weeklyBase: "Wöchentlicher Betrag",
    weeklyInterest: "Zinsen",
    monthlyInterest: "Zinsen",
    deposit: "Einzahlung",
    withdrawal: "Auszahlung"
  };

  var state = null;
  var activeTab = "balance";
  var settingsUnlocked = false;
  var pinBuffer = "";
  var pinMode = "verify"; // verify | set-new-1 | set-new-2
  var pendingNewPin = "";
  var pinError = false;
  var isDeposit = true;
  var addAmountValue = "";
  var addDateValue = "";   // leer = heute
  var addNoteValue = "";
  var sheetTxId = null;    // Buchung, die im Bearbeiten-Fenster offen ist
  var editDraft = null;    // { type, amount, date }
  var confirmDelete = false;
  var unlockedBySheet = false;
  var justBooked = false;
  var showResetConfirm = false;
  var savedToast = false;
  var selectedWeek = null;   // ISO-Datum des Wochenbeginns im Verlauf
  var animateChart = false;
  var forecastWeeks = 4;    // Vorschau im Verlauf: 0, 4, 13 oder 52 Wochen

  // ---------- storage ----------
  function loadState() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }
  function saveState() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
  }
  async function sha256Hex(str) {
    var enc = new TextEncoder().encode(str);
    var buf = await crypto.subtle.digest("SHA-256", enc);
    return Array.prototype.map.call(new Uint8Array(buf), function (b) { return b.toString(16).padStart(2, "0"); }).join("");
  }

  // ---------- date helpers ----------
  function toISO(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
  function parseISO(s) { var p = s.split("-").map(Number); return new Date(p[0], p[1] - 1, p[2]); }
  function startOfDay(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
  function addDays(d, n) { var r = new Date(d); r.setDate(r.getDate() + n); return r; }
  function nextWeekdayOnOrAfter(from, weekday) { var d = startOfDay(from); var diff = (weekday - d.getDay() + 7) % 7; return addDays(d, diff); }
  function lastWeekdayOnOrBefore(from, weekday) { var d = startOfDay(from); var diff = (d.getDay() - weekday + 7) % 7; return addDays(d, -diff); }
  function formatDate(iso) { return parseISO(iso).toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit", year: "numeric" }); }
  function formatDateWeekday(iso) { return parseISO(iso).toLocaleDateString("de-DE", { weekday: "short", day: "2-digit", month: "2-digit" }); }

  // ---------- number helpers ----------
  function round2(n) { return Math.round(n * 100) / 100; }
  function uid() { return "x" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
  function formatNumber(n) {
    var r = round2(n);
    return Math.abs(r - Math.round(r)) < 0.001 ? String(Math.round(r)) : r.toFixed(2).replace(".", ",");
  }
  function formatAmount(n) { return formatNumber(n) + " " + (state.settings ? state.settings.currencySymbol : "Credits"); }

  // ---------- ledger logic ----------
  function signedAmount(tx) { return tx.type === "withdrawal" ? -tx.amount : tx.amount; }
  function computeBalance() { return round2(state.transactions.reduce(function (sum, t) { return sum + signedAmount(t); }, 0)); }

  function firstOfNextMonth(d) { return new Date(d.getFullYear(), d.getMonth() + 1, 1); }

  // Taschengeld jeden Samstag, Zinsen am 1. jedes Monats (Zinstag) auf das Guthaben vom Monatsende.
  function catchUp() {
    if (!state.settings) return;
    var s = state.settings;
    var today = startOfDay(new Date());
    var firstNew = null, newInterest = [];
    for (var cursor = nextBookingDate(); cursor <= today; cursor = addDays(cursor, 7)) {
      var iso = toISO(cursor);
      if (s.interestMode !== "percentage" && s.weeklyFixedAmount > 0) {
        state.transactions.push({ id: uid(), type: "weeklyBase", amount: s.weeklyFixedAmount, date: iso });
      }
      s.lastAutoBookingDate = iso;
      if (!firstNew) firstNew = iso;
    }
    for (var m = nextInterestDate(); m <= today; m = firstOfNextMonth(m)) {
      var mIso = toISO(m);
      if (s.interestMode !== "fixed" && s.monthlyInterestPercent > 0) {
        var tx = { id: uid(), type: "monthlyInterest", amount: 0, date: mIso, rate: s.monthlyInterestPercent };
        state.transactions.push(tx); newInterest.push(tx);
      }
      s.lastInterestDate = mIso;
      if (!firstNew || mIso < firstNew) firstNew = mIso;
    }
    if (!firstNew) return;
    recalcInterestFrom(firstNew);
    // Zinstag ohne Guthaben: keine Null-Buchung stehen lassen
    state.transactions = state.transactions.filter(function (t) { return newInterest.indexOf(t) < 0 || t.amount > 0; });
    saveState();
  }

  // Alte Version hatte Wochenzinsen: Satz an den alten Buchungen festhalten, Zahl als Monatssatz übernehmen,
  // neue Regel gilt ab dem nächsten Monatsersten.
  function migrateSettings() {
    var s = state.settings;
    if (!s || s.monthlyInterestPercent !== undefined) return;
    var legacy = s.weeklyInterestPercent || 0, balance = 0;
    chronological().forEach(function (t) {
      if (t.type === "weeklyInterest" && t.rate === undefined) t.rate = inferRate(t, balance, legacy);
      balance = round2(balance + signedAmount(t));
    });
    s.monthlyInterestPercent = legacy;
    delete s.weeklyInterestPercent;
    var now = new Date();
    s.lastInterestDate = toISO(new Date(now.getFullYear(), now.getMonth(), 1));
    saveState();
  }

  // Reihenfolge innerhalb eines Tages: Start, Taschengeld, Zinsen, dann manuelle Buchungen.
  var TYPE_RANK = { initial: 0, monthlyInterest: 1, weeklyBase: 2, weeklyInterest: 3, deposit: 4, withdrawal: 4 };
  function chronological() {
    return state.transactions.map(function (t, i) { return { t: t, i: i }; })
      .sort(function (a, b) { return a.t.date.localeCompare(b.t.date) || TYPE_RANK[a.t.type] - TYPE_RANK[b.t.type] || a.i - b.i; })
      .map(function (x) { return x.t; });
  }

  // Zinssatz einer älteren Zinsbuchung ohne gespeicherten Satz aus Betrag und Vorher-Guthaben ableiten.
  function inferRate(tx, balanceBefore, pct) {
    if (balanceBefore <= 0) return pct;
    if (round2(balanceBefore * pct / 100) === tx.amount) return pct;
    return round2(tx.amount / balanceBefore * 100);
  }

  // Nach Änderungen an früheren Buchungen: Zinsbuchungen ab fromISO mit dem damaligen Satz neu berechnen.
  // Monatszinsen zählen das Guthaben vor dem Zinstag (Monatsende), alte Wochenzinsen das Guthaben direkt davor.
  function recalcInterestFrom(fromISO) {
    var balance = 0, day = null, dayStart = 0;
    chronological().forEach(function (t) {
      if (t.date !== day) { day = t.date; dayStart = balance; }
      if (t.date >= fromISO) {
        if (t.type === "monthlyInterest") t.amount = round2(Math.max(0, dayStart) * t.rate / 100);
        else if (t.type === "weeklyInterest" && t.rate !== undefined) t.amount = round2(Math.max(0, balance) * t.rate / 100);
      }
      balance = round2(balance + signedAmount(t));
    });
  }

  function nextBookingDate() {
    var s = state.settings;
    return s.lastAutoBookingDate ? addDays(parseISO(s.lastAutoBookingDate), 7) : nextWeekdayOnOrAfter(parseISO(s.startDate), s.bookingWeekday);
  }
  function nextInterestDate() {
    var s = state.settings;
    return firstOfNextMonth(parseISO(s.lastInterestDate || s.startDate));
  }
  function interestActive(mode, pct) { return mode !== "fixed" && pct > 0; }

  // Künftige Gutschriften durchrechnen (ohne Ausgaben). Am selben Tag zuerst Zinsen, dann Taschengeld.
  function simulateEvents(balance, rule, endDate) {
    var ev = [];
    if (rule.mode !== "percentage" && rule.fixed > 0)
      for (var d = rule.nextBase; d <= endDate; d = addDays(d, 7)) ev.push({ date: d, kind: "base" });
    if (interestActive(rule.mode, rule.pct))
      for (var m = rule.nextInterest; m <= endDate; m = firstOfNextMonth(m)) ev.push({ date: m, kind: "interest" });
    ev.sort(function (a, b) { return a.date - b.date || (a.kind === "interest" ? -1 : 1); });
    ev.forEach(function (e) {
      e.amount = e.kind === "base" ? rule.fixed : round2(Math.max(0, balance) * rule.pct / 100);
      balance = round2(balance + e.amount);
      e.balance = balance;
    });
    return ev;
  }
  function currentRule() {
    var s = state.settings;
    return { mode: s.interestMode, fixed: s.weeklyFixedAmount, pct: s.monthlyInterestPercent, nextBase: nextBookingDate(), nextInterest: nextInterestDate() };
  }

  function completeOnboarding(startBalance, startDateISO, weeklyAmount, interestMode, interestPercent) {
    state.settings = {
      weeklyFixedAmount: round2(Math.max(0, weeklyAmount)),
      monthlyInterestPercent: interestMode === "fixed" ? 0 : round2(Math.max(0, interestPercent)),
      lastInterestDate: null,
      interestMode: interestMode,
      bookingWeekday: 6,
      startDate: startDateISO,
      lastAutoBookingDate: null,
      currencySymbol: "Credits"
    };
    state.transactions = [{ id: uid(), type: "initial", amount: round2(Math.abs(startBalance)), date: startDateISO }];
    saveState();
    catchUp();
  }

  function addManualTransaction(amount, deposit, dateISO, note) {
    var a = round2(Math.abs(amount));
    if (a <= 0) return;
    var date = clampBookingDate(dateISO);
    var tx = { id: uid(), type: deposit ? "deposit" : "withdrawal", amount: a, date: date };
    if (cleanNote(note)) tx.note = cleanNote(note);
    state.transactions.push(tx);
    recalcInterestFrom(date);
    saveState();
  }

  function resetAll() {
    state.transactions = [];
    state.settings = null;
    saveState();
  }

  // ---------- rendering ----------
  function el(id) { return document.getElementById(id); }

  function refreshUI() {
    var onboarded = !!state.settings;
    el("onboarding-view").hidden = onboarded;
    el("app-main").hidden = !onboarded;
    el("tabbar").hidden = !onboarded;

    if (!onboarded) { renderOnboarding(); return; }

    ["balance", "add", "history", "settings"].forEach(function (t) { el(t + "-view").hidden = (t !== activeTab); });
    el("pageTitle").textContent = TITLES[activeTab];
    Array.prototype.forEach.call(document.querySelectorAll(".tab"), function (b) {
      b.classList.toggle("active", b.dataset.tab === activeTab);
    });

    if (activeTab === "balance") renderBalance();
    else if (activeTab === "add") renderAdd();
    else if (activeTab === "history") renderHistory();
    else if (activeTab === "settings") renderSettings();
    renderSheet();
  }

  function renderOnboarding() {
    var d = el("ob-date");
    if (!d.value) d.value = toISO(lastWeekdayOnOrBefore(new Date(), 6));
  }

  function modeHelpHTML(mode, fixed, percent) {
    var cur = el("set-currency") ? cleanCurrency(el("set-currency").value) : state.settings.currencySymbol;
    var base = computeBalance();
    var f = function (n) { return formatNumber(n) + " " + cur; };
    var zinstag = formatDate(toISO(nextInterestDate()));
    var text, example;
    if (mode === "fixed") {
      text = "Jeden Samstag kommt derselbe Betrag dazu. Das Guthaben wächst gleichmäßig.";
      example = f(base) + " + " + f(fixed) + " = <b>" + f(round2(base + fixed)) + "</b>";
    } else {
      var i = round2(base * percent / 100);
      text = (mode === "percentage" ? "Es gibt kein festes Taschengeld. " : "Jeden Samstag kommt der Fixbetrag dazu. ") +
        "Am 1. jedes Monats ist Zinstag: Dann gibt es Zinsen auf das Guthaben vom Monatsende. Weil die Zinsen danach mitverzinst werden, wächst das Guthaben mit der Zeit immer schneller (Zinseszins).";
      example = "Wenn am Monatsende " + f(base) + " auf dem Konto sind: " + formatNumber(percent) + " % = <b>" + f(i) + " Zinsen</b>";
    }
    var rule = { mode: mode, fixed: fixed, pct: percent, nextBase: nextBookingDate(), nextInterest: nextInterestDate() };
    var year = simulateEvents(base, rule, addDays(startOfDay(new Date()), 365));
    var sumBase = 0, sumInterest = 0;
    year.forEach(function (e) { if (e.kind === "base") sumBase = round2(sumBase + e.amount); else sumInterest = round2(sumInterest + e.amount); });
    var cost = [];
    if (sumBase) cost.push(f(sumBase) + " Taschengeld");
    if (sumInterest) cost.push("≈ " + f(sumInterest) + " Zinsen");
    return '<p>' + text + '</p>' +
      '<p><span class="muted">Beispiel mit dem aktuellen Guthaben:</span><br>' + example + '</p>' +
      (cost.length ? '<p><span class="muted">Im nächsten Jahr sind das zusammen:</span><br><b>' + cost.join(" + ") + '</b><br><span class="muted">(wenn nichts ausgegeben wird)</span></p>' : '') +
      '<p class="muted">Änderungen gelten ab der nächsten Buchung: Taschengeld am ' + formatDate(toISO(nextBookingDate())) +
        (interestActive(mode, percent) ? ", Zinsen am " + zinstag : "") + '. Bereits gebuchte bleiben, wie sie sind.</p>';
  }
  function updateModeHelp() {
    var box = el("settings-mode-help");
    if (!box) return;
    box.innerHTML = modeHelpHTML(el("set-mode").value,
      round2(Math.max(0, parseFloat(el("set-fixed").value) || 0)),
      round2(Math.max(0, parseFloat(el("set-percent").value) || 0)));
  }

  function ruleDescription(s) {
    if (s.interestMode === "fixed") return "+" + formatNumber(s.weeklyFixedAmount) + " " + s.currencySymbol + " pro Woche";
    if (s.interestMode === "percentage") return "+" + formatNumber(s.monthlyInterestPercent) + " % Zinsen im Monat";
    return "+" + formatNumber(s.weeklyFixedAmount) + " " + s.currencySymbol + " pro Woche & " + formatNumber(s.monthlyInterestPercent) + " % Zinsen im Monat";
  }

  function renderBalance() {
    var s = state.settings;
    var balance = computeBalance();
    el("balance-view").innerHTML =
      '<div class="balance-hero">' +
        '<div class="balance-label">Dein Guthaben</div>' +
        '<div class="balance-amount">' + formatAmount(balance) + '</div>' +
        '<div class="balance-since muted">seit ' + formatDate(state.transactions[0].date) + '</div>' +
        '<div class="rule-pill">' + ruleDescription(s) + '</div>' +
        (s.interestMode !== "percentage" ? '<div class="next-booking">Nächstes Taschengeld: ' + formatDateWeekday(toISO(nextBookingDate())) + '</div>' : '') +
        (interestActive(s.interestMode, s.monthlyInterestPercent) ? '<div class="next-booking">Nächster Zinstag: ' + formatDateWeekday(toISO(nextInterestDate())) + '</div>' : '') +
      '</div>';
  }

  function escapeHtml(v) {
    return String(v).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; });
  }
  function cleanNote(v) { return String(v || "").trim().slice(0, 40); }
  var NOTE_SUGGESTIONS = {
    deposit: ["🎂 Geburtstag", "👵 Oma & Opa", "🧹 Mithelfen", "🔎 Gefunden"],
    withdrawal: ["🍭 Süßes", "🧸 Spielzeug", "📚 Buch", "🎁 Geschenk"]
  };
  function noteFieldHTML(id, value, deposit) {
    return '<div class="field-label" style="margin:16px 0 10px;">Wofür? <span style="text-transform:none;letter-spacing:0;font-weight:600;">(freiwillig)</span></div>' +
      '<input type="text" id="' + id + '" maxlength="40" autocomplete="off" placeholder="' + (deposit ? "z. B. Geburtstag" : "z. B. Eis") + '" value="' + escapeHtml(value) + '">' +
      '<div class="currency-chips">' +
        NOTE_SUGGESTIONS[deposit ? "deposit" : "withdrawal"].map(function (n) {
          return '<button type="button" data-action="pick-note" data-target="' + id + '" data-value="' + n + '">' + n + '</button>';
        }).join("") +
      '</div>';
  }

  // Nachträgliche Buchungen: frühestens am Startdatum, höchstens heute.
  function clampBookingDate(iso) {
    var today = toISO(new Date()), min = state.settings.startDate;
    if (!iso || iso > today) return today;
    return iso < min ? min : iso;
  }

  function renderAdd() {
    el("add-view").innerHTML =
      '<div class="direction-row">' +
        '<button class="direction-btn deposit' + (isDeposit ? " active" : "") + '" data-action="toggle-direction" data-dir="deposit">Einzahlen</button>' +
        '<button class="direction-btn withdraw' + (!isDeposit ? " active" : "") + '" data-action="toggle-direction" data-dir="withdraw">Ausgeben</button>' +
      '</div>' +
      '<div class="card amount-input-wrap">' +
        '<div class="field-label" style="margin-bottom:10px;">Betrag (' + state.settings.currencySymbol + ')</div>' +
        '<input type="number" id="add-amount-input" min="0" step="0.5" inputmode="decimal" placeholder="0" value="' + addAmountValue + '">' +
        '<div class="field-label" style="margin:16px 0 10px;">Datum</div>' +
        '<input type="date" id="add-date-input" min="' + state.settings.startDate + '" max="' + toISO(new Date()) + '" value="' + clampBookingDate(addDateValue) + '">' +
        '<div class="date-hint muted" id="add-date-hint"></div>' +
        '<div class="note-center">' + noteFieldHTML("add-note-input", addNoteValue, isDeposit) + '</div>' +
      '</div>' +
      '<button class="btn btn-block ' + (isDeposit ? "btn-primary" : "btn-danger-solid") + '" id="submit-tx-btn" data-action="submit-transaction">' + (isDeposit ? "Einzahlen" : "Ausgeben") + '</button>' +
      '<div class="toast">' + (justBooked ? "Gebucht ✓" : "") + '</div>';
    var input = el("add-amount-input");
    var btn = el("submit-tx-btn");
    function sync() { btn.disabled = !(parseFloat(input.value) > 0); }
    input.addEventListener("input", function () { addAmountValue = input.value; sync(); });
    var dateInput = el("add-date-input");
    function syncDate() {
      var iso = clampBookingDate(dateInput.value);
      el("add-date-hint").textContent = iso === toISO(new Date()) ? "Heute" : "Nachträglich für " + formatDateWeekday(iso);
    }
    dateInput.addEventListener("change", function () { addDateValue = dateInput.value; syncDate(); });
    el("add-note-input").addEventListener("input", function (e) { addNoteValue = e.target.value; });
    syncDate();
    sync();
  }

  // Wochen beginnen am Buchungstag (Samstag), die automatische Gutschrift steht also immer am Wochenanfang.
  function weekBuckets() {
    var wd = state.settings.bookingWeekday;
    var sorted = state.transactions.slice().sort(function (a, b) { return a.date.localeCompare(b.date); });
    if (!sorted.length) return [];
    var byKey = {};
    sorted.forEach(function (t) {
      var k = toISO(lastWeekdayOnOrBefore(parseISO(t.date), wd));
      (byKey[k] = byKey[k] || []).push(t);
    });
    var cursor = lastWeekdayOnOrBefore(parseISO(sorted[0].date), wd);
    var lastWeek = lastWeekdayOnOrBefore(new Date(), wd);
    var buckets = [], balance = 0, interestTotal = 0;
    while (cursor <= lastWeek) {
      var key = toISO(cursor), txs = byKey[key] || [];
      var b = { key: key, txs: txs, initial: 0, base: 0, interest: 0, deposit: 0, withdrawal: 0 };
      txs.forEach(function (t) {
        var isInterest = t.type === "weeklyInterest" || t.type === "monthlyInterest";
        var f = t.type === "weeklyBase" ? "base" : isInterest ? "interest" : t.type;
        b[f] = round2(b[f] + t.amount);
        balance = round2(balance + signedAmount(t));
        if (isInterest) interestTotal = round2(interestTotal + t.amount);
        if (t.type === "monthlyInterest") b.interestDay = true;
      });
      b.balance = balance;
      b.interestTotal = interestTotal;
      buckets.push(b);
      cursor = addDays(cursor, 7);
    }
    return buckets;
  }

  // Vorschau: mit der aktuellen Sparregel weiterrechnen, ohne Ausgaben. Was in dieser Woche noch aussteht,
  // landet in der ersten Vorschau-Woche.
  function forecastBuckets(past, weeks) {
    var last = past[past.length - 1], lastKey = parseISO(last.key);
    var out = [];
    for (var i = 1; i <= weeks; i++) {
      out.push({ key: toISO(addDays(lastKey, 7 * i)), txs: [], forecast: true, initial: 0, base: 0, interest: 0, deposit: 0, withdrawal: 0 });
    }
    if (!weeks) return out;
    var events = simulateEvents(last.balance, currentRule(), addDays(lastKey, 7 * (weeks + 1) - 1));
    var interestTotal = last.interestTotal, ei = 0;
    out.forEach(function (b) {
      var end = addDays(parseISO(b.key), 7);
      b.balance = ei > 0 ? events[ei - 1].balance : last.balance;
      while (ei < events.length && events[ei].date < end) {
        var e = events[ei++];
        if (e.kind === "base") b.base = round2(b.base + e.amount);
        else { b.interest = round2(b.interest + e.amount); b.interestDay = true; interestTotal = round2(interestTotal + e.amount); }
        b.balance = e.balance;
      }
      b.interestTotal = interestTotal;
    });
    return out;
  }
  function allBuckets() {
    var past = weekBuckets();
    if (!past.length) return past;
    past[past.length - 1].current = true;
    return past.concat(forecastBuckets(past, forecastWeeks));
  }

  function weekInfoHTML(buckets, idx) {
    var b = buckets[idx], cur = state.settings.currencySymbol;
    var chips = [];
    if (b.initial) chips.push('<span class="week-chip base">Start: ' + formatNumber(b.initial) + '</span>');
    if (b.base) chips.push('<span class="week-chip base">+' + formatNumber(b.base) + ' Taschengeld</span>');
    if (b.interest) chips.push('<span class="week-chip interest">+' + formatNumber(b.interest) + ' Zinsen ✨</span>');
    if (b.deposit) chips.push('<span class="week-chip base">+' + formatNumber(b.deposit) + ' eingezahlt</span>');
    if (b.withdrawal) chips.push('<span class="week-chip neg">−' + formatNumber(b.withdrawal) + ' ausgegeben</span>');
    var msg;
    if (b.forecast) {
      var cur0 = buckets.filter(function (x) { return x.current; })[0];
      var gain = round2(b.balance - cur0.balance), gainInterest = round2(b.interestTotal - cur0.interestTotal);
      msg = "Vorschau: So viel hast du dann, wenn du bis dahin nichts ausgibst. Das sind " + formatNumber(gain) + " " + cur + " mehr als heute" +
        (gainInterest > 0 ? ", davon " + formatNumber(gainInterest) + " " + cur + " durch Zinsen." : ".");
    }
    else if (b.initial) msg = "Hier hat alles angefangen!";
    else if (b.interest) msg = (b.interestDay ? "Zinstag! " : "") + "Deine Zinsen haben " + formatNumber(b.interest) + " " + cur + " für dich verdient.";
    else if (b.withdrawal) msg = "Diese Woche hast du etwas ausgegeben.";
    else if (!b.txs.length) msg = "Diese Woche ist noch nichts passiert.";
    else msg = "Weiter so!";
    var title = b.current ? "Diese Woche" : (b.forecast ? "Vorschau: " : "") + "Woche ab " + formatDateWeekday(b.key);
    return '<div class="week-info-head"><div class="week-info-title">' + title + '</div>' +
        '<div class="week-info-balance">' + (b.forecast ? "≈ " : "") + formatAmount(b.balance) + '</div></div>' +
      (chips.length ? '<div class="week-chips">' + chips.join("") + '</div>' : "") +
      '<div class="week-msg">' + msg + '</div>' +
      '<div class="week-nav">' +
        '<button class="btn btn-ghost" data-action="week-step" data-step="-1"' + (idx === 0 ? " disabled" : "") + '>‹ Früher</button>' +
        '<button class="btn btn-ghost" data-action="week-step" data-step="1"' + (idx === buckets.length - 1 ? " disabled" : "") + '>Später ›</button>' +
      '</div>';
  }

  function buildChart() {
    var buckets = allBuckets();
    if (!buckets.length) return '<div class="chart-empty muted">Noch keine Entwicklung – bald wächst hier dein Guthaben.</div>';
    var last = buckets.filter(function (b) { return b.current; })[0];
    if (!selectedWeek || !buckets.some(function (b) { return b.key === selectedWeek; })) selectedWeek = last.key;
    var maxV = Math.max.apply(null, buckets.map(function (b) { return b.balance; })) || 1;
    var bars = "", labels = "";
    buckets.forEach(function (b) {
      var bal = Math.max(0, b.balance);
      var h = bal > 0 ? Math.max(4, bal / maxV * 100) : 1.5;
      var interestPart = bal > 0 ? Math.min(1, b.interestTotal / bal) : 0;
      var sel = b.key === selectedWeek ? " selected" : "";
      var fc = b.forecast ? " forecast" : "";
      var d = parseISO(b.key);
      if (b.forecast && b === buckets[buckets.indexOf(last) + 1]) {
        bars += '<span class="today-divider" aria-hidden="true"></span>';
        labels += '<span class="today-divider" aria-hidden="true"></span>';
      }
      bars += '<button class="bar' + sel + fc + '" data-action="select-week" data-week="' + b.key + '" style="--h:' + h.toFixed(1) + '%" aria-label="' + (b.forecast ? "Vorschau " : "") + 'Woche ab ' + formatDate(b.key) + ': ' + formatAmount(b.balance) + '">' +
          '<span class="bar-value">' + (b.forecast ? "≈ " : "") + formatNumber(b.balance) + '</span>' +
          '<span class="bar-stack">' +
            (interestPart > 0 ? '<span class="seg-interest" style="height:' + (interestPart * 100).toFixed(1) + '%"></span>' : "") +
            '<span class="seg-saved"></span>' +
          '</span>' +
        '</button>';
      labels += '<span class="' + (sel + fc).trim() + '" data-label="' + b.key + '">' + d.getDate() + '.' + (d.getMonth() + 1) + '.</span>';
    });
    var idx = buckets.findIndex(function (b) { return b.key === selectedWeek; });
    var saved = round2(last.balance - last.interestTotal);
    return '<div class="chart-title">So ist dein Geld gewachsen</div>' +
      '<div class="chart-summary">' +
        '<div class="sum-chip saved"><div class="sum-label">Selbst gespart</div><div class="sum-value">' + formatNumber(saved) + '</div></div>' +
        '<div class="sum-chip interest"><div class="sum-label">Von Zinsen geschenkt</div><div class="sum-value">' + formatNumber(last.interestTotal) + '</div></div>' +
      '</div>' +
      '<div class="forecast-row"><span class="forecast-label">Blick in die Zukunft</span>' +
        '<div class="segmented" role="group" aria-label="Vorschau">' +
          [[0, "Aus"], [4, "4 Wochen"], [13, "3 Monate"], [52, "1 Jahr"]].map(function (o) {
            return '<button data-action="set-forecast" data-weeks="' + o[0] + '"' + (forecastWeeks === o[0] ? ' class="active"' : '') + '>' + o[1] + '</button>';
          }).join("") +
        '</div></div>' +
      '<div class="bars-scroll" id="bars-scroll">' +
        '<div class="bars' + (animateChart ? " grow" : "") + '" id="bars">' + bars + '</div>' +
        '<div class="bar-labels">' + labels + '</div>' +
      '</div>' +
      '<div class="legend"><span><i style="background:var(--accent)"></i>Dein Geld</span><span><i style="background:var(--gold)"></i>Zinsen</span>' +
        (forecastWeeks ? '<span><i class="striped"></i>Vorschau</span>' : '') + '</div>' +
      '<div class="week-info" id="week-info">' + weekInfoHTML(buckets, idx) + '</div>';
  }

  function selectWeek(key) {
    var buckets = allBuckets();
    var idx = buckets.findIndex(function (b) { return b.key === key; });
    if (idx < 0) return;
    selectedWeek = key;
    Array.prototype.forEach.call(document.querySelectorAll("#bars .bar"), function (n) { n.classList.toggle("selected", n.dataset.week === key); });
    Array.prototype.forEach.call(document.querySelectorAll(".bar-labels span"), function (n) { n.classList.toggle("selected", n.dataset.label === key); });
    el("week-info").innerHTML = weekInfoHTML(buckets, idx);
    scrollBarIntoView(key, true);
  }

  function scrollBarIntoView(key, smooth) {
    var scroller = el("bars-scroll");
    var bar = scroller && scroller.querySelector('[data-week="' + key + '"]');
    if (!bar) return;
    var target = bar.offsetLeft - (scroller.clientWidth - bar.offsetWidth) / 2;
    if (smooth && scroller.scrollTo) scroller.scrollTo({ left: target, behavior: "smooth" });
    else scroller.scrollLeft = target;
  }

  function txIcon(type) {
    if (type === "withdrawal") return '<div class="tx-icon neg"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg></div>';
    if (type === "weeklyInterest" || type === "monthlyInterest") return '<div class="tx-icon gold"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3M12 18v3M5 12H2M22 12h-3M6 6l2 2M18 6l-2 2M6 18l2-2M18 18l-2-2"/><circle cx="12" cy="12" r="4"/></svg></div>';
    return '<div class="tx-icon pos"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></div>';
  }

  function renderHistory() {
    var sortedDesc = state.transactions.slice().sort(function (a, b) { return b.date.localeCompare(a.date) || b.id.localeCompare(a.id); });
    var rows = sortedDesc.map(function (t) {
      var signed = signedAmount(t);
      return '<button class="tx-row tappable" data-action="open-tx" data-id="' + t.id + '">' + txIcon(t.type) +
        '<div class="tx-body"><div class="tx-type">' + (t.note ? escapeHtml(t.note) : TYPE_LABEL[t.type]) + '</div>' +
          '<div class="tx-date">' + (t.note ? TYPE_LABEL[t.type] + ' · ' : '') + formatDate(t.date) + '</div></div>' +
        '<div class="tx-amount ' + (signed < 0 ? "neg" : "pos") + '">' + (signed < 0 ? "−" : "+") + " " + formatNumber(Math.abs(signed)) + '</div>' +
        (isEditable(t) ? '<span class="tx-chevron">›</span>' : '') +
        '</button>';
    }).join("");
    el("history-view").innerHTML = '<div class="card chart-card">' + buildChart() + '</div><div class="tx-list">' + rows + '</div>';
    if (selectedWeek) scrollBarIntoView(selectedWeek, false);
    if (animateChart) {
      animateChart = false;
      requestAnimationFrame(function () { requestAnimationFrame(function () {
        var bars = el("bars"); if (bars) bars.classList.remove("grow");
      }); });
    }
  }

  // ---------- Buchung bearbeiten ----------
  function isEditable(t) { return t.type === "deposit" || t.type === "withdrawal" || t.type === "initial"; }
  function findTx(id) { return state.transactions.filter(function (t) { return t.id === id; })[0]; }

  function openTxSheet(id) {
    var t = findTx(id);
    if (!t) return;
    sheetTxId = id;
    editDraft = { type: t.type, amount: String(t.amount), date: t.date, note: t.note || "" };
    confirmDelete = false;
    pinMode = "verify"; pinBuffer = ""; pinError = false;
    refreshUI();
  }
  function closeTxSheet() {
    sheetTxId = null; editDraft = null; confirmDelete = false;
    if (unlockedBySheet) { settingsUnlocked = false; unlockedBySheet = false; }
    pinBuffer = ""; pinError = false;
    refreshUI();
  }

  function renderSheet() {
    var backdrop = el("sheet-backdrop");
    var t = sheetTxId && findTx(sheetTxId);
    backdrop.hidden = !t;
    if (!t) return;
    var head = function (title) { return '<div class="sheet-head"><div class="sheet-title">' + title + '</div><button class="sheet-close" data-action="sheet-close" aria-label="Schließen">✕</button></div>'; };
    var html;
    if (!isEditable(t)) {
      html = head(TYPE_LABEL[t.type]) +
        '<div class="card stack"><div class="sheet-note">' +
          '<b>' + formatAmount(t.amount) + '</b> am ' + formatDate(t.date) +
          (t.rate !== undefined ? ' (' + formatNumber(t.rate) + ' % ' + (t.type === "monthlyInterest" ? "im Monat" : "pro Woche") + ')' : '') + '.<br>' +
          '<span class="muted">Automatisch gebucht. Wird von selbst angepasst, wenn frühere Buchungen geändert werden.</span>' +
        '</div></div>';
    } else if (!settingsUnlocked) {
      html = head("Buchung ändern") + '<div class="card">' + pinPadHTML("Eltern-PIN", "Zum Ändern oder Löschen") + '</div>';
    } else if (t.type === "initial") {
      html = head("Startguthaben ändern") +
        '<div class="card stack">' +
          '<div><div class="field-label">Betrag (' + state.settings.currencySymbol + ')</div>' +
          '<input type="number" id="edit-amount" min="0" step="0.5" inputmode="decimal" value="' + editDraft.amount + '"></div>' +
          '<div class="sheet-note muted">Startdatum: ' + formatDate(t.date) + '. Die Zinsen danach werden neu berechnet.</div>' +
          '<button class="btn btn-primary btn-block" data-action="edit-save">Speichern</button>' +
        '</div>';
    } else {
      var dep = editDraft.type === "deposit";
      html = head("Buchung ändern") +
        '<div class="stack">' +
          '<div class="direction-row">' +
            '<button class="direction-btn deposit' + (dep ? " active" : "") + '" data-action="edit-dir" data-dir="deposit">Einzahlung</button>' +
            '<button class="direction-btn withdraw' + (!dep ? " active" : "") + '" data-action="edit-dir" data-dir="withdrawal">Auszahlung</button>' +
          '</div>' +
          '<div class="card stack">' +
            '<div><div class="field-label">Betrag (' + state.settings.currencySymbol + ')</div>' +
            '<input type="number" id="edit-amount" min="0" step="0.5" inputmode="decimal" value="' + editDraft.amount + '"></div>' +
            '<div><div class="field-label">Datum</div>' +
            '<input type="date" id="edit-date" min="' + state.settings.startDate + '" max="' + toISO(new Date()) + '" value="' + editDraft.date + '"></div>' +
            '<div>' + noteFieldHTML("edit-note", editDraft.note, dep).replace('style="margin:16px 0 10px;"', 'style="margin-bottom:10px;"') + '</div>' +
          '</div>' +
          '<button class="btn btn-primary btn-block" data-action="edit-save">Speichern</button>' +
          (confirmDelete ?
            '<div class="danger-box"><div class="sheet-note" style="font-weight:700;">Diese Buchung wirklich löschen?</div>' +
              '<div class="confirm-row"><button class="btn btn-ghost" data-action="edit-delete-cancel">Abbrechen</button><button class="btn btn-danger-solid" data-action="edit-delete-confirm">Löschen</button></div></div>' :
            '<button class="btn btn-danger btn-block" data-action="edit-delete">Buchung löschen</button>') +
        '</div>';
    }
    el("sheet").innerHTML = html;
    var amt = el("edit-amount"), dt = el("edit-date");
    if (amt) amt.addEventListener("input", function () { editDraft.amount = amt.value; });
    if (dt) dt.addEventListener("change", function () { editDraft.date = dt.value; });
    var nt = el("edit-note");
    if (nt) nt.addEventListener("input", function () { editDraft.note = nt.value; });
  }

  function saveTxEdit() {
    var t = findTx(sheetTxId);
    var amount = round2(Math.abs(parseFloat(editDraft.amount) || 0));
    if (!t || (amount <= 0 && t.type !== "initial")) return;
    var oldDate = t.date;
    t.amount = amount;
    if (t.type !== "initial") {
      t.type = editDraft.type;
      t.date = clampBookingDate(editDraft.date);
      if (cleanNote(editDraft.note)) t.note = cleanNote(editDraft.note); else delete t.note;
    }
    recalcInterestFrom(oldDate < t.date ? oldDate : t.date);
    saveState();
    closeTxSheet();
  }

  function deleteTx() {
    var t = findTx(sheetTxId);
    if (!t || t.type === "initial") return;
    state.transactions = state.transactions.filter(function (x) { return x.id !== t.id; });
    recalcInterestFrom(t.date);
    saveState();
    closeTxSheet();
  }

  // ---------- PIN pad ----------
  function pinPadHTML(title, sub) {
    var dots = "";
    for (var i = 0; i < 4; i++) dots += '<div class="pin-dot' + (i < pinBuffer.length ? " filled" : "") + '"></div>';
    var rows = [["1", "2", "3"], ["4", "5", "6"], ["7", "8", "9"], ["", "0", "back"]];
    var keys = rows.map(function (row) {
      return row.map(function (k) {
        if (k === "") return '<button class="pin-key empty"></button>';
        if (k === "back") return '<button class="pin-key" data-action="pin-digit" data-digit="back">⌫</button>';
        return '<button class="pin-key" data-action="pin-digit" data-digit="' + k + '">' + k + '</button>';
      }).join("");
    }).join("");
    return '<div class="pin-title">' + title + '</div>' +
      (sub ? '<div class="pin-sub muted">' + sub + '</div>' : "") +
      '<div class="pin-dots">' + dots + '</div>' +
      '<div class="pin-error">' + (pinError ? "Falsche PIN" : "") + '</div>' +
      '<div class="pin-grid">' + keys + '</div>';
  }

  async function handlePinDigit(d) {
    if (d === "back") { pinBuffer = pinBuffer.slice(0, -1); pinError = false; refreshUI(); return; }
    if (pinBuffer.length >= 4) return;
    pinBuffer += d;
    pinError = false;
    if (pinBuffer.length < 4) { refreshUI(); return; }

    if (pinMode === "verify") {
      var hash = await sha256Hex(pinBuffer);
      pinBuffer = "";
      if (hash === state.pinHash) { settingsUnlocked = true; if (sheetTxId) unlockedBySheet = true; }
      else { pinError = true; }
    } else if (pinMode === "set-new-1") {
      pendingNewPin = pinBuffer; pinBuffer = ""; pinMode = "set-new-2";
    } else if (pinMode === "set-new-2") {
      if (pinBuffer === pendingNewPin) {
        state.pinHash = await sha256Hex(pinBuffer);
        saveState();
        pinMode = "verify"; pendingNewPin = ""; savedToast = true;
        setTimeout(function () { savedToast = false; refreshUI(); }, 1500);
      } else { pinError = true; pinMode = "set-new-1"; pendingNewPin = ""; }
      pinBuffer = "";
    }
    refreshUI();
  }

  // ---------- settings ----------
  function renderSettings() {
    if (!settingsUnlocked) {
      var title = pinMode === "verify" ? "Eltern-PIN" : (pinMode === "set-new-1" ? "Neue PIN eingeben" : "Neue PIN bestätigen");
      el("settings-view").innerHTML = '<div class="card">' + pinPadHTML(title, pinMode === "verify" ? "Für Fixbetrag, Zins und Reset" : null) + '</div>';
      return;
    }
    var s = state.settings;
    el("settings-view").innerHTML =
      '<div class="stack">' +
      '<div class="card stack">' +
        '<div class="settings-section-title">Sparregeln</div>' +
        '<div><div class="field-label">Name der Währung</div>' +
          '<input type="text" id="set-currency" maxlength="16" autocomplete="off" value="' + s.currencySymbol + '">' +
          '<div class="currency-chips">' +
            ["Credits", "Taler", "€", "💶", "💰", "🪙", "💵", "💸", "🐷", "🏦"].map(function (c) {
              return '<button type="button" data-action="pick-currency" data-value="' + c + '">' + c + '</button>';
            }).join("") +
          '</div>' +
        '</div>' +
        '<div><div class="field-label">Fixbetrag / Woche</div><input type="number" id="set-fixed" min="0" step="1" value="' + s.weeklyFixedAmount + '"></div>' +
        '<div><div class="field-label">Zins-Modus</div>' +
          '<select id="set-mode">' +
            '<option value="fixed"' + (s.interestMode === "fixed" ? " selected" : "") + '>Nur Fixbetrag</option>' +
            '<option value="percentage"' + (s.interestMode === "percentage" ? " selected" : "") + '>Nur Prozent</option>' +
            '<option value="combined"' + (s.interestMode === "combined" ? " selected" : "") + '>Fixbetrag + Prozent</option>' +
          '</select>' +
        '</div>' +
        '<div class="mode-help" id="settings-mode-help"></div>' +
        '<div id="settings-percent-group"' + (s.interestMode === "fixed" ? " hidden" : "") + '>' +
          '<div class="field-label">Zins % / Monat</div><input type="number" id="set-percent" min="0" step="0.5" value="' + s.monthlyInterestPercent + '">' +
        '</div>' +
        '<button class="btn btn-primary btn-block" data-action="settings-save">Speichern</button>' +
        '<div class="toast">' + (savedToast ? "Gespeichert ✓" : "") + '</div>' +
      '</div>' +
      '<div class="card stack">' +
        '<div class="settings-section-title">PIN ändern</div>' +
        '<button class="btn btn-ghost btn-block" data-action="change-pin-start">Neue Eltern-PIN festlegen</button>' +
      '</div>' +
      '<div class="danger-box">' +
        '<div class="settings-section-title" style="color:var(--danger);">Von vorne beginnen</div>' +
        '<p class="muted" style="font-size:13.5px;margin:6px 0 0;">Löscht alle Buchungen und Einstellungen unwiderruflich. Danach startet die Einrichtung neu.</p>' +
        (showResetConfirm ?
          '<div class="confirm-row"><button class="btn btn-ghost" data-action="reset-cancel">Abbrechen</button><button class="btn btn-danger-solid" data-action="reset-confirm">Alles löschen</button></div>' :
          '<button class="btn btn-danger btn-block" style="margin-top:12px;" data-action="reset-open">Von vorne beginnen…</button>') +
      '</div>' +
      '<button class="btn btn-ghost btn-block" data-action="settings-done">Fertig</button>' +
      '<p class="footnote">Daten werden nur lokal auf diesem Tablet gespeichert (kein Cloud-Abgleich). · Version ' + APP_VERSION + '</p>' +
      '</div>';

    el("set-mode").addEventListener("change", function (e) {
      el("settings-percent-group").hidden = (e.target.value === "fixed");
      updateModeHelp();
    });
    el("set-fixed").addEventListener("input", updateModeHelp);
    el("set-currency").addEventListener("input", updateModeHelp);
    el("set-percent").addEventListener("input", updateModeHelp);
    updateModeHelp();
  }

  // Wird per innerHTML angezeigt: HTML-Zeichen entfernen.
  function cleanCurrency(v) {
    v = String(v || "").replace(/[<>&"'`]/g, "").trim().slice(0, 16);
    return v || "Credits";
  }

  function handleSettingsSave() {
    var s = state.settings;
    s.currencySymbol = cleanCurrency(el("set-currency").value);
    s.weeklyFixedAmount = round2(Math.max(0, parseFloat(el("set-fixed").value) || 0));
    s.interestMode = el("set-mode").value;
    var percentField = el("set-percent");
    s.monthlyInterestPercent = percentField ? round2(Math.max(0, parseFloat(percentField.value) || 0)) : 0;
    saveState();
    savedToast = true;
    refreshUI();
    setTimeout(function () { savedToast = false; refreshUI(); }, 1500);
  }

  // ---------- events ----------
  document.addEventListener("click", async function (e) {
    var b = e.target.closest("[data-action]");
    if (!b) return;
    var action = b.dataset.action;

    if (action === "switch-tab") {
      if (b.dataset.tab === "history" && activeTab !== "history") { animateChart = true; selectedWeek = null; }
      activeTab = b.dataset.tab; refreshUI();
    }
    else if (action === "select-week") { selectWeek(b.dataset.week); }
    else if (action === "set-forecast") {
      forecastWeeks = Number(b.dataset.weeks);
      var fb = allBuckets();
      selectedWeek = fb[fb.length - 1].key;   // Ergebnis der Vorschau direkt zeigen
      refreshUI();
    }
    else if (action === "pick-note") {
      var ni = el(b.dataset.target);
      if (ni) { ni.value = b.dataset.value; ni.dispatchEvent(new Event("input")); }
    }
    else if (action === "pick-currency") { el("set-currency").value = b.dataset.value; updateModeHelp(); }
    else if (action === "open-tx") { openTxSheet(b.dataset.id); }
    else if (action === "sheet-close") { closeTxSheet(); }
    else if (action === "sheet-backdrop") { if (e.target === b) closeTxSheet(); }
    else if (action === "edit-dir") { editDraft.type = b.dataset.dir; refreshUI(); }
    else if (action === "edit-save") { saveTxEdit(); }
    else if (action === "edit-delete") { confirmDelete = true; refreshUI(); }
    else if (action === "edit-delete-cancel") { confirmDelete = false; refreshUI(); }
    else if (action === "edit-delete-confirm") { deleteTx(); }
    else if (action === "week-step") {
      var wb = allBuckets();
      var wi = wb.findIndex(function (x) { return x.key === selectedWeek; }) + Number(b.dataset.step);
      if (wi >= 0 && wi < wb.length) selectWeek(wb[wi].key);
    }
    else if (action === "onboarding-submit") {
      var bal = parseFloat(el("ob-balance").value) || 0;
      var date = el("ob-date").value || toISO(lastWeekdayOnOrBefore(new Date(), 6));
      var weekly = parseFloat(el("ob-weekly").value) || 0;
      var mode = el("ob-mode").value;
      var percent = parseFloat(el("ob-percent").value) || 0;
      completeOnboarding(bal, date, weekly, mode, percent);
      activeTab = "balance";
      refreshUI();
    }
    else if (action === "toggle-direction") { isDeposit = (b.dataset.dir === "deposit"); refreshUI(); }
    else if (action === "submit-transaction") {
      var amt = parseFloat(addAmountValue) || 0;
      if (amt > 0) {
        addManualTransaction(amt, isDeposit, addDateValue, addNoteValue);
        addNoteValue = "";
        addAmountValue = "";
        addDateValue = "";
        justBooked = true;
        refreshUI();
        setTimeout(function () { justBooked = false; refreshUI(); }, 1500);
      }
    }
    else if (action === "pin-digit") { await handlePinDigit(b.dataset.digit); }
    else if (action === "settings-save") { handleSettingsSave(); }
    else if (action === "change-pin-start") { pinMode = "set-new-1"; pinBuffer = ""; pendingNewPin = ""; pinError = false; refreshUI(); }
    else if (action === "reset-open") { showResetConfirm = true; refreshUI(); }
    else if (action === "reset-cancel") { showResetConfirm = false; refreshUI(); }
    else if (action === "reset-confirm") {
      resetAll(); settingsUnlocked = false; showResetConfirm = false; activeTab = "balance"; pinMode = "verify"; pinBuffer = "";
      refreshUI();
    }
    else if (action === "settings-done") { settingsUnlocked = false; pinMode = "verify"; pinBuffer = ""; refreshUI(); }
  });

  document.addEventListener("change", function (e) {
    if (e.target.id === "ob-mode") el("ob-percent-group").hidden = (e.target.value === "fixed");
  });

  // ---------- boot ----------
  async function boot() {
    Array.prototype.forEach.call(document.querySelectorAll(".app-version"), function (n) { n.textContent = APP_VERSION; });
    state = loadState() || { transactions: [], settings: null, pinHash: null };
    if (!state.pinHash) { state.pinHash = await sha256Hex("0000"); saveState(); }
    migrateSettings();
    if (state.settings) catchUp();
    refreshUI();
  }
  boot();
})();
</script>
<script>
if ("serviceWorker" in navigator) {
  // Neue Version aktiv geworden: einmal neu laden, damit sie sofort sichtbar ist.
  var hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange", function () {
    if (hadController) location.reload();
  });
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js", { updateViaCache: "none" })
      .then(function (reg) { reg.update(); })
      .catch(function () {});
  });
}
</script>
</body>
</html>
